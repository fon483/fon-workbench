<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FON工作台</title>
<style>
:root{
  --pink:#7ec8e3;
  --pink-2:#b8e3f4;
  --pink-deep:#3b9fc9;
  --pink-dark:#2e85ab;
  --pink-bg:#eef9fd;
  --pink-line:#d6eff8;
  --card:#ffffff;
  --text:#3a4a52;
  --muted:#8aa0ad;
  --grad:linear-gradient(120deg,#a8dff2 0%,#7ec8e3 55%,#5ab4d6 100%);
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:12px;
  --shadow:0 4px 16px rgba(91,180,214,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:var(--pink-bg);color:var(--text);font-size:14px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);outline:none}

/* ========== 布局骨架 ========== */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* ========== 左侧导航 ========== */
.sidebar{
  width:216px;flex-shrink:0;background:#fff;
  border-right:1px solid var(--pink-line);
  display:flex;flex-direction:column;align-items:stretch;
  position:sticky;top:0;height:100vh;z-index:60;
  padding:26px 14px 18px;
}
.side-head{display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:22px;border-bottom:1px dashed var(--pink-line);margin-bottom:16px}
.avatar{
  width:70px;height:70px;border-radius:50%;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;
  border:3px solid #dff4fc;cursor:pointer;user-select:none;overflow:hidden;
  box-shadow:0 4px 12px rgba(91,180,214,.32);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.side-title{font-size:17px;font-weight:700;letter-spacing:1px;color:var(--text)}
.side-sub{font-size:11px;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:6px}
.menu-item{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--radius-md);
  color:#6e8796;font-size:14.5px;position:relative;transition:all .2s;width:100%;text-align:left;
}
.menu-item svg{width:19px;height:19px;stroke:#9abccf;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s;flex-shrink:0}
.menu-item:hover{background:#f0f9fd;color:var(--pink-deep)}
.menu-item.active{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(91,180,214,.35)}
.menu-item.active svg{stroke:#fff}
.dot{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-radius:50%;background:#ff7a8f;border:1.5px solid #fff;
}
.side-foot{margin-top:auto;text-align:center;font-size:11px;color:#b8d4e0;padding-top:14px}
.sync-box{margin-top:14px;background:rgba(255,255,255,.55);border:1px solid var(--pink-line);border-radius:var(--radius-md);padding:9px 11px}
.sync-row{display:flex;align-items:center;gap:8px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#b8d4e0;flex-shrink:0;transition:background .2s}
.sync-dot.ok{background:#46c08a}
.sync-dot.err{background:#ff7a8f}
.sync-dot.sync{background:#3b9fc9;animation:syncPulse 1s infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.35}}
.sync-txt{font-size:11.5px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-btn{font-size:11px;color:var(--pink-deep);background:none;border:none;cursor:pointer;font-weight:700;flex-shrink:0;padding:2px}
.sync-btn:hover{text-decoration:underline}

/* ========== 顶部通栏 ========== */
.banner{
  background:var(--grad);color:#fff;padding:22px 28px 0;
  border-radius:0 0 26px 26px;position:relative;overflow:hidden;
}
.banner::before{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.banner::after{content:"";position:absolute;right:70px;top:60px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.10)}
.banner-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1}
.banner-left{display:flex;align-items:flex-start;gap:10px;min-width:0;overflow:hidden}
.banner-left>div{min-width:0;overflow:hidden}
.banner-title{font-size:26px;font-weight:800;letter-spacing:2px;text-shadow:0 2px 6px rgba(46,133,171,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner-sub{font-size:12.5px;opacity:.92;margin-top:6px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-pick{
  position:relative;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.45);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
  cursor:pointer;flex-shrink:0;backdrop-filter:blur(4px);white-space:nowrap;
}
.date-pick svg{width:15px;height:15px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round}
.date-pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.tabs{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1;padding-bottom:14px}
.tab{
  padding:9px 22px;border-radius:999px;font-size:13.5px;color:#fff;font-weight:600;
  background:transparent;border:1px solid rgba(255,255,255,.55);transition:all .2s;
}
.tab.active{background:#fff;color:var(--pink-deep);border-color:#fff;box-shadow:0 3px 10px rgba(46,133,171,.22)}

/* ========== 内容区 ========== */
.content{padding:20px 28px 110px;max-width:980px;width:100%;margin:0 auto}
.card{
  background:var(--card);border-radius:var(--radius-lg);padding:20px 22px;
  box-shadow:var(--shadow);margin-bottom:18px;
}
.sec + .sec{border-top:1.5px dashed var(--pink-line);margin-top:18px;padding-top:18px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sec-ico{
  width:30px;height:30px;border-radius:10px;background:var(--pink-bg);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.sec-title{font-size:15.5px;font-weight:700;color:var(--pink-dark)}
.sec-count{font-size:11.5px;color:var(--muted);margin-left:auto}

/* 条目 */
.item{padding:13px 2px;border-bottom:1px dashed var(--pink-line)}
.item:hover{background:#f8fcfe;border-radius:10px}
.item:last-child{border-bottom:none}
.item.done .item-name{text-decoration:line-through;color:var(--muted)}
.item-main{display:flex;align-items:flex-start;gap:9px}
.item-ico{font-size:16px;line-height:1.5;flex-shrink:0}
.item-name{font-size:14.5px;font-weight:600;line-height:1.5;flex:1;min-width:0;word-break:break-all}
.item-note{font-size:12.5px;font-weight:400;color:var(--muted)}
.item-btns{display:flex;gap:8px;margin-top:9px;margin-left:25px;flex-wrap:wrap}

/* 标签 */
.tag{
  flex-shrink:0;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;
  border:1px solid transparent;white-space:nowrap;align-self:flex-start;margin-top:2px;
}
.tag-high{background:#ffe4ea;color:#e05a7d;border-color:#ffc9d6}
.tag-mid{background:#fff1de;color:#e8963e;border-color:#ffe0b8}
.tag-low{background:#e3f4ec;color:#4caf87;border-color:#c4e8d8}
.tag-doing{background:#e5f0ff;color:#4d8bd6;border-color:#c8dff8}
.tag-wait{background:#f3ecff;color:#9268d8;border-color:#e0d2f8}
.tag-done{background:#e3f4ec;color:#4caf87;border-color:#c4e8d8}
.tag-work{background:#e5f4fc;color:#3b9fc9;border-color:#c8e9f6}
.tag-life{background:#e3f4ec;color:#4caf87;border-color:#c4e8d8}
.tag-study{background:#e5f0ff;color:#4d8bd6;border-color:#c8dff8}
.tag-idea{background:#f3ecff;color:#9268d8;border-color:#e0d2f8}
.tag-other{background:#f1f5f7;color:#8f9aa0;border-color:#e2e9ed}
.tag-pos{background:#e5f4fc;color:#3b9fc9;border-color:#c8e9f6}

/* 按钮 */
.pill-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--grad);color:#fff;font-size:12px;font-weight:600;
  padding:7px 15px;border-radius:999px;transition:all .15s;
  box-shadow:0 3px 8px rgba(91,180,214,.28);
}
.pill-btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(91,180,214,.4)}
.pill-btn:active{transform:translateY(0) scale(.96)}
.pill-btn.ghost{background:#fff;color:var(--pink-deep);border:1.5px solid var(--pink-2);box-shadow:none}
.pill-btn.ghost:hover{background:var(--pink-bg)}
.pill-btn.green{background:linear-gradient(120deg,#7fd8b2,#55c294)}
.pill-btn.gray{background:#e9f2f6;color:#8aa0ad;box-shadow:none}
.pill-btn svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* 统计栏 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat-box{
  background:var(--pink-bg);border-radius:var(--radius-md);padding:14px 10px;text-align:center;
  border:1px solid var(--pink-line);
}
.stat-num{font-size:22px;font-weight:800;color:var(--pink-deep)}
.stat-label{font-size:11.5px;color:var(--muted);margin-top:3px}

/* 输入类 */
.search-box{
  display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;
  padding:10px 16px;margin-bottom:16px;box-shadow:var(--shadow);border:1.5px solid transparent;transition:border .2s;
}
.search-box:focus-within{border-color:var(--pink-2)}
.search-box svg{width:16px;height:16px;stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round}
.search-box input{flex:1;border:none;background:none;font-size:13.5px}
textarea.journal{
  width:100%;min-height:110px;border:1.5px solid var(--pink-line);border-radius:var(--radius-md);
  padding:12px 14px;resize:vertical;font-size:13.5px;line-height:1.7;background:#f8fcfe;transition:border .2s;
}
textarea.journal:focus{border-color:var(--pink-2)}
.save-hint{font-size:11px;color:var(--muted);text-align:right;margin-top:6px}

/* 筛选 chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{
  font-size:12px;padding:6px 14px;border-radius:999px;background:#fff;color:#7a95a4;
  border:1.5px solid var(--pink-line);transition:all .15s;
}
.chip.active{background:var(--grad);color:#fff;border-color:transparent;font-weight:600}
.chips select{
  margin-left:auto;border:1.5px solid var(--pink-line);border-radius:999px;padding:6px 10px;
  font-size:12px;background:#fff;color:#7a95a4;cursor:pointer;
}

/* 历史折叠 */
details.hist{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
details.hist summary{
  list-style:none;display:flex;align-items:center;gap:10px;padding:16px 20px;cursor:pointer;font-weight:700;font-size:14.5px;
}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary .arr{margin-left:auto;transition:transform .2s;color:var(--pink-2);font-size:12px}
details.hist[open] summary .arr{transform:rotate(90deg)}
details.hist .hist-body{padding:0 20px 16px;border-top:1px dashed var(--pink-line)}
.hist-badge{font-size:11px;color:var(--pink-deep);background:var(--pink-bg);padding:3px 10px;border-radius:999px;font-weight:600}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
.cal-head b{font-size:15px}
.cal-nav{width:30px;height:30px;border-radius:50%;background:var(--pink-bg);color:var(--pink-deep);font-size:14px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-week{font-size:11.5px;color:var(--muted);padding:4px 0}
.cal-day{
  aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;position:relative;background:#f8fcfe;border:1px solid transparent;cursor:default;
}
.cal-day.has{background:var(--pink-bg);border-color:var(--pink-line);cursor:pointer;font-weight:600;color:var(--pink-deep)}
.cal-day.has:hover{background:var(--pink-2);color:#fff}
.cal-day.sel{background:var(--grad);color:#fff;font-weight:700}
.cal-day .cd{width:5px;height:5px;border-radius:50%;background:var(--pink-deep);margin-top:2px}
.cal-day.sel .cd{background:#fff}
.cal-day.empty{background:transparent}

/* 空状态 */
.empty{text-align:center;padding:34px 0;color:#a8c0cc}
.empty .e-ico{font-size:34px;margin-bottom:8px}
.empty p{font-size:12.5px}

/* 悬浮按钮 */
.fabs{position:fixed;right:22px;bottom:26px;display:flex;flex-direction:column;gap:12px;z-index:50}
.fab{
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(59,159,201,.4);transition:transform .15s;
}
.fab:active{transform:scale(.92)}
.fab.add{background:var(--grad);color:#fff;font-size:26px;font-weight:300}
.fab.top{background:#fff;color:var(--pink-deep);font-size:18px;border:1.5px solid var(--pink-line);box-shadow:0 4px 12px rgba(91,180,214,.22)}

/* 弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(46,72,84,.45);z-index:100;display:none;
  align-items:center;justify-content:center;padding:20px;
}
.modal-mask.show{display:flex}
.modal{
  background:#fff;border-radius:var(--radius-lg);width:100%;max-width:420px;max-height:86vh;overflow-y:auto;
  padding:24px 24px 20px;animation:pop .22s ease;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:16.5px;color:var(--pink-dark);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field textarea,.field select{
  width:100%;border:1.5px solid var(--pink-line);border-radius:var(--radius-sm);padding:10px 13px;
  background:#f8fcfe;transition:border .2s;
}
.field textarea{min-height:90px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--pink-2)}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btns .pill-btn{flex:1;justify-content:center;padding:11px}
.full-text{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-all;color:var(--text)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:rgba(46,72,84,.9);color:#fff;font-size:13px;padding:10px 22px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:200;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== 达人资源库 ========== */
.banner-search{
  position:relative;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.45);
  padding:8px 14px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:6px;
  flex-shrink:0;backdrop-filter:blur(4px);min-width:140px;max-width:260px;width:100%
}
.banner-search svg{width:15px;height:15px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;flex-shrink:0}
.banner-search input{flex:1;border:none;background:none;color:#fff;font-size:13px;min-width:0}
.banner-search input::placeholder{color:rgba(255,255,255,.75)}
mark{background:#ffe9a8;color:#8a6d1a;border-radius:4px;padding:0 2px}
.tal-card{background:var(--card);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.tal-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.tal-ava{
  width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex-shrink:0;
}
.tal-name{font-size:16px;font-weight:800;flex:1;min-width:0}
.tal-tags{display:flex;gap:6px;flex-shrink:0}
.tag-dy{background:#e8ecf8;color:#4a5fc4;border-color:#d2daf3}
.tag-ks{background:#fff0e2;color:#e8813e;border-color:#ffddbc}
.tag-sph{background:#e3f4ec;color:#3ea677;border-color:#c4e8d8}
.tag-live{background:#f3ecff;color:#9268d8;border-color:#e0d2f8}
.tag-video{background:#e5f4fc;color:#3b9fc9;border-color:#c8e9f6}
.tag-coop0{background:#f1f5f7;color:#8f9aa0;border-color:#e2e9ed}
.tag-coop1{background:#fff1de;color:#e8963e;border-color:#ffe0b8}
.tag-coop2{background:#e3f4ec;color:#4caf87;border-color:#c4e8d8}
.tal-info{border-top:1px dashed var(--pink-line);padding-top:10px}
.tal-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;flex-wrap:wrap}
.tal-row .tl{color:var(--muted);font-size:12.5px;flex-shrink:0;width:76px}
.tal-row .tv{flex:1;min-width:120px;word-break:break-all}
.tal-row .tv small{color:var(--muted);font-size:11px}
.copy-btn{
  background:var(--pink-bg);color:var(--pink-deep);font-size:11px;font-weight:600;
  padding:4px 12px;border-radius:999px;border:1px solid var(--pink-line);flex-shrink:0;transition:all .15s;
}
.copy-btn:hover{background:var(--pink-2);color:#fff}
.tal-note{
  background:#f8fcfe;border:1px dashed var(--pink-line);border-radius:var(--radius-sm);
  padding:9px 12px;font-size:12.5px;color:#7a95a4;line-height:1.6;margin-top:8px;
}
.tal-foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.drop-zone{
  border:2px dashed var(--pink-2);border-radius:var(--radius-md);padding:34px 16px;text-align:center;
  color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s;background:#f8fcfe;
}
.drop-zone:hover,.drop-zone.over{border-color:var(--pink-deep);background:var(--pink-bg);color:var(--pink-deep)}
.drop-zone .dz-ico{font-size:32px;margin-bottom:8px}
.drop-zone .dz-sub{font-size:11.5px;margin-top:5px;color:#a8c0cc}
.pv-item{display:flex;align-items:flex-start;gap:9px;padding:10px 2px;border-bottom:1px dashed var(--pink-line);font-size:13px}
.pv-item:last-child{border-bottom:none}
.pv-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--pink-deep);margin-top:2px;flex-shrink:0}
.pv-item .pv-body{flex:1;min-width:0}
.pv-item .pv-name{font-weight:700}
.pv-item .pv-meta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;word-break:break-all}

/* 页面切换动画 */
.content{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ========== 移动端适配 ========== */
@media (max-width:768px){
  .sidebar{
    position:sticky;width:96px;padding:18px 8px 14px;flex-shrink:0;
    border-right:1px solid var(--pink-line);
  }
  .side-head{padding-bottom:14px;margin-bottom:12px}
  .avatar{width:52px;height:52px;font-size:22px;border-width:2px}
  .side-title{font-size:12px;letter-spacing:0;color:var(--text)}
  .side-sub{display:none}
  .menu-item{
    flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:11.5px;text-align:center;
  }
  .menu-item svg{width:22px;height:22px}
  .menu-item span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{right:6px;top:8px;transform:none}
  .side-foot{display:none}
  .sync-box{margin-top:10px;padding:7px 8px}
  .sync-txt{font-size:10px}
  .sync-btn{font-size:10px}
  .banner{padding:16px 16px 0;border-radius:0 0 22px 22px}
  .banner-row{flex-wrap:wrap}
  .banner-left{flex:1 1 auto;min-width:140px}
  .banner-search{flex:1 1 100%;max-width:none;margin-top:6px}
  .banner-title{font-size:21px}
  .banner-sub{font-size:11.5px}

    if(c.pass){ payload=await encryptText(payload, c.pass); }
    const content=b64enc(payload);
    const method=sha?'PUT':'POST';
    await ghApi('data.json',method,{message:'FON sync '+new Date().toLocaleString(),content,sha:sha||undefined});
    c.lastSync=Date.now(); setCfg(c); setSync('ok','已同步 · '+timeAgo(c.lastSync));
  }catch(e){ setSync('err','同步失败：'+friendlyErr(e)); console.error('pushCloud',e); }
}
async function pullCloud(){
  const c=getCfg();
  if(!c.owner||!c.repo||!c.token){ toast('请先配置 Gitee 同步设置'); openSyncSettings(); return; }
  setSync('sync','拉取中…');
  try{
    const cur=await ghApi('data.json','GET');
    if(cur.notfound){ setSync('ok','云端暂无数据'); return; }
    let raw=b64dec(cur.content);
    if(raw.startsWith('ENC1:')||raw.startsWith('ENC2:')){
      if(!c.pass){ throw new Error('云端数据已加密，请在「同步设置」中填写加密密码'); }
      raw=await decryptText(raw, c.pass);
    }
    const data=JSON.parse(raw);
    store=data; save(); render();
    c.lastSync=Date.now(); setCfg(c); setSync('ok','已同步 · '+timeAgo(c.lastSync));
    toast('已从云端拉取最新数据');
  }catch(e){ setSync('err','拉取失败：'+friendlyErr(e)); console.error('pullCloud',e); }
}

function friendlyErr(e){
  const m=(e&&e.message)||String(e);
  if(/401|unauthorized|token/i.test(m)) return '令牌无效或权限不足（请检查令牌是否正确、是否勾选了 projects 权限）';
  if(/403|rate/i.test(m)) return 'Gitee 拒绝（可能限流，或令牌权限不足）';
  if(/404/.test(m)) return '找不到仓库/文件（请检查 用户名、仓库名、分支 是否填对）';
  if(/Failed to fetch|NetworkError|load failed|timeout/i.test(m)) return '网络连不上 Gitee（请确认网络可访问 gitee.com）';
  if(/Cannot read|undefined/i.test(m)) return '浏览器环境不支持（请确认用的是在线链接并已强制刷新）';
  return m;
}

function getNavOrder(){
  const all = Object.keys(MODS);
  let ord = (store && Array.isArray(store.navOrder)) ? store.navOrder.slice() : [];
  ord = ord.filter(k=>all.includes(k));
  for(const k of all){ if(!ord.includes(k)) ord.push(k); }
  return ord;
}
function setNavOrder(arr){
  store.navOrder = arr;
  save();
  renderMenu();
}
function moveNav(k, dir){
  const ord = getNavOrder();
  const i = ord.indexOf(k);
  const j = i + (dir==='up'?-1:1);
  if(j<0 || j>=ord.length) return;
  [ord[i], ord[j]] = [ord[j], ord[i]];
  setNavOrder(ord);
}
function resetNav(){ setNavOrder(Object.keys(MODS)); toast('已恢复默认顺序'); }
function toggleNavEdit(){ state.navEdit = !state.navEdit; renderMenu(); }
let _navDrag = null;
function navDragStart(k, e){ _navDrag = k; if(e&&e.dataTransfer) e.dataTransfer.effectAllowed='move'; }
function navDragOver(e){ e.preventDefault(); if(e&&e.dataTransfer) e.dataTransfer.dropEffect='move'; }
function navDrop(k){
  if(!_navDrag || _navDrag===k) return;
  const ord = getNavOrder();
  const from = ord.indexOf(_navDrag);
  const to = ord.indexOf(k);
  ord.splice(from, 1);
  ord.splice(to, 0, _navDrag);
  _navDrag = null;
  setNavOrder(ord);
}

/* ================= 红点逻辑 ================= */
function hasDot(mod){
  const t = today();
  if(mod==='plan'){ return (store.plans[t]||[]).some(p=>!p.done); }
  if(mod==='work'){ const w=store.work[t]; return !!w && (w.tasks.some(x=>x.status!=='已完成') || w.follows.some(x=>!x.flag)); }
  if(mod==='memo'){ return store.memos.some(m=>m.created===t); }
  if(mod==='eng'){ return !store.eng.checkins[t]; }
  if(mod==='talent'){ return store.talents.some(x=>x.created===t); }
  if(mod==='hot'){ return hotData.some(x=>x.date===t); }
  if(mod==='side'){ return sideData.some(x=>x.date===t); }
  return false;
}

function renderPlanHist(){
  const now = Date.now();
  let dates = Object.keys(store.plans).filter(d=>store.plans[d].length).sort().reverse();
  if(state.planFilter==='week') dates = dates.filter(d=> now - new Date(d+'T00:00:00').getTime() <= 7*864e5);
  if(state.planFilter==='month') dates = dates.filter(d=> now - new Date(d+'T00:00:00').getTime() <= 30*864e5);
  const chips = [['all','全部'],['week','近一周'],['month','近一月']].map(([v,t])=>
    `<button class="chip ${state.planFilter===v?'active':''}" onclick="state.planFilter='${v}';render()">${t}</button>`).join('');
  const blocks = dates.map(d=>{
    const list = store.plans[d]; const dn = list.filter(p=>p.done).length;
    return `<details class="hist">
      <summary>🗓️ ${fmtCN(d)} <span class="hist-badge">${dn}/${list.length} 完成</span><span class="arr">▶</span></summary>
      <div class="hist-body">
        ${list.map(p=>`<div class="item ${p.done?'done':''}">
          <div class="item-main"><span class="item-ico">${p.done?'✅':'⭕'}</span>
          <span class="item-name">${esc(p.name)}${p.note?`<span class="item-note">（${esc(p.note)}）</span>`:''}</span>${priTag(p.pri)}</div>
        </div>`).join('')}
      </div>
    </details>`;
  }).join('');
  return `<div class="chips">${chips}</div>${blocks || '<div class="card">'+emptyHtml('🗂️','该时间范围内暂无历史计划')+'</div>'}`;
}

function addPlan(){

    {k:'note',l:'备注说明（截止时间、注意事项）',t:'text'},

  ], {pri:'中'}, v=>{

  });
}
function editPlan(id){
  const p = getPlans(state.date).find(x=>x.id===id); if(!p) return;
  openForm('✎ 编辑待办', [
    {k:'name',l:'待办事项名称',t:'text',req:1},
    {k:'note',l:'备注说明',t:'text'},
    {k:'pri',l:'优先级',t:'select',opts:['高','中','低']}
  ], p, v=>{ Object.assign(p,v); save(); render(); toast('已保存修改 ✔'); });
}
function togglePlan(id){ const p=getPlans(state.date).find(x=>x.id===id); if(p){ p.done=!p.done; save(); render(); toast(p.done?'完成啦，真棒 🌷':'已恢复为待办'); } }
function delPlan(id){ if(!confirm('确定删除这条待办吗？')) return; store.plans[state.date]=getPlans(state.date).filter(x=>x.id!==id); save(); render(); toast('已删除'); }

/* ================= 模块2：工作专区 ================= */

function renderWorkHist(){
  const kw = state.workSearch.trim().toLowerCase();
  let dates = Object.keys(store.work).sort().reverse().filter(d=>{
    const w = store.work[d];
    if(!w.tasks.length && !w.follows.length && !w.journal) return false;
    if(!kw) return true;
    const blob = (w.tasks.map(t=>t.name+t.note).join(' ')+' '+w.follows.map(f=>f.name+f.note).join(' ')+' '+w.journal).toLowerCase();
    return blob.includes(kw);
  });
  const blocks = dates.map(d=>{
    const w = store.work[d];
    return `<details class="hist">
      <summary>🗓️ ${fmtCN(d)} <span class="hist-badge">${w.tasks.length} 任务</span><span class="arr">▶</span></summary>
      <div class="hist-body">
        ${w.tasks.map(t=>`<div class="item"><div class="item-main"><span class="item-ico">💼</span><span class="item-name">${esc(t.name)}${t.note?`<span class="item-note">（${esc(t.note)}）</span>`:''}</span>${stTag(t.status)}</div></div>`).join('')}
        ${w.follows.map(f=>`<div class="item"><div class="item-main"><span class="item-ico">${f.flag?'✅':'🔔'}</span><span class="item-name">${esc(f.name)}${f.note?`<span class="item-note">（${esc(f.note)}）</span>`:''}</span></div></div>`).join('')}
        ${w.journal?`<div class="item"><div class="item-main"><span class="item-ico">✏️</span><span class="item-name" style="font-weight:400;font-size:13px;color:#7a95a4">${esc(w.journal)}</span></div></div>`:''}
      </div>
    </details>`;
  }).join('');
  return `
  <div class="search-box">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="关键词搜索过往工作记录…" value="${esc(state.workSearch)}" oninput="onSearch('workSearch',this)">
  </div>
  ${blocks || '<div class="card">'+emptyHtml('🔍','没有匹配的工作记录')+'</div>'}`;
}

function addTask(){
  openForm('＋ 新增核心任务',[
    {k:'name',l:'任务名称',t:'text',req:1},
    {k:'note',l:'备注（截止时间、对接人）',t:'text'},
    {k:'status',l:'当前状态',t:'select',opts:['待启动','进行中','已完成']}
  ],{status:'待启动'},v=>{ getWork(state.date).tasks.push({id:uid(),...v}); save(); render(); toast('任务已添加 ✔'); });
}
function editTask(id){
  const t = getWork(state.date).tasks.find(x=>x.id===id); if(!t) return;
  openForm('✎ 编辑任务',[
    {k:'name',l:'任务名称',t:'text',req:1},
    {k:'note',l:'备注',t:'text'},
    {k:'status',l:'当前状态',t:'select',opts:['待启动','进行中','已完成']}
  ],t,v=>{ Object.assign(t,v); save(); render(); toast('已保存 ✔'); });
}
function cycleTask(id){
  const t = getWork(state.date).tasks.find(x=>x.id===id); if(!t) return;
  const order = ['待启动','进行中','已完成'];
  t.status = order[(order.indexOf(t.status)+1)%3];
  save(); render(); toast('状态已更新为「'+t.status+'」');
}
function viewTask(id){
  const t = getWork(state.date).tasks.find(x=>x.id===id); if(!t) return;
  openView('💼 任务详情', `任务名称：${t.name}\n备注信息：${t.note||'无'}\n当前状态：${t.status}\n所属日期：${fmtCN(state.date)}`);
}
function delTask(id){ if(!confirm('确定删除该任务？')) return; const w=getWork(state.date); w.tasks=w.tasks.filter(x=>x.id!==id); save(); render(); toast('已删除'); }
function addFollow(){
  openForm('＋ 新增跟进事项',[
    {k:'name',l:'事项名称',t:'text',req:1},
    {k:'note',l:'备注',t:'text'}
  ],{},v=>{ getWork(state.date).follows.push({id:uid(),...v,flag:false}); save(); render(); toast('已添加 ✔'); });
}
function toggleFollow(id){ const f=getWork(state.date).follows.find(x=>x.id===id); if(f){ f.flag=!f.flag; save(); render(); toast(f.flag?'已标记跟进 ✔':'已取消标记'); } }
function delFollow(id){ if(!confirm('确定删除？')) return; const w=getWork(state.date); w.follows=w.follows.filter(x=>x.id!==id); save(); render(); toast('已删除'); }
let jTimer=null;
function saveJournal(v){
  getWork(state.date).journal = v;
  $('#jHint').textContent='保存中…';
  clearTimeout(jTimer);
  jTimer=setTimeout(()=>{ save(); const h=$('#jHint'); if(h) h.textContent='已自动保存 ✔'; renderMenu(); },500);
}

function memoSearchBox(){

function filterMemos(list){

function renderMemoToday(){

function renderMemoAll(){

    {k:'content',l:'笔记内容',t:'textarea',req:1},
    {k:'cat',l:'分类标签',t:'select',opts:['工作','生活','学习','灵感','其他']}

/* ================= 模块4：英语学习 ================= */
function checkin(type){
  const t = state.date;
  if(!store.eng.checkins[t]) store.eng.checkins[t]={add:0,rev:0};
  store.eng.checkins[t][type]++;
}
function calcStreak(){
  let n=0, d=new Date();
  while(store.eng.checkins[dstr(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function renderEngToday(){
  const words = store.eng.words;
  const news = words.filter(w=>w.date===state.date);
  const reviews = words.filter(w=>w.inBook && !w.mastered && w.date!==state.date).slice(0,8);
  const ck = store.eng.checkins[state.date]||{add:0,rev:0};
  const wordRow = (w,isRev) => `
  <div class="item ${w.mastered?'done':''}">
    <div class="item-main">
      <span class="item-ico">📖</span>
      <span class="item-name">${esc(w.word)}<span class="item-note">（${esc(w.mean)}）</span></span>
      <span class="tag tag-pos">${w.pos}</span>
    </div>
    <div class="item-btns">
      ${isRev ? `
        <button class="pill-btn green" onclick="reviewWord('${w.id}',true)">${IC.check} 记住了</button>
        <button class="pill-btn ghost" onclick="reviewWord('${w.id}',false)">↻ 没记住</button>
      ` : `
        <button class="pill-btn ${w.inBook?'gray':''}" onclick="toggleBook('${w.id}')">${IC.star} ${w.inBook?'已在生词本':'加入生词本'}</button>
        <button class="pill-btn ${w.mastered?'gray':'green'}" onclick="toggleMaster('${w.id}')">${IC.check} ${w.mastered?'已掌握':'标记已掌握'}</button>
        <button class="pill-btn ghost" onclick="delWord('${w.id}')">${IC.del} 删除</button>
      `}
    </div>
  </div>`;
  return `
  <div class="card">
    <div class="sec">
      <div class="sec-head"><span class="sec-ico">🆕</span><span class="sec-title">今日新单词</span><span class="sec-count">${news.length} 个</span></div>
      ${news.length?news.map(w=>wordRow(w,false)).join(''):emptyHtml('🐣','今天还没有录入新单词')}
      <div style="text-align:center;margin-top:10px"><button class="pill-btn ghost" onclick="addWord()">＋ 录入新单词</button></div>
    </div>
    <div class="sec">
      <div class="sec-head"><span class="sec-ico">🔁</span><span class="sec-title">今日复习生词</span><span class="sec-count">${reviews.length} 个</span></div>
      ${reviews.length?reviews.map(w=>wordRow(w,true)).join(''):emptyHtml('🎈','生词本里没有待复习的单词啦')}
    </div>
    <div class="sec">
      <div class="sec-head"><span class="sec-ico">🔥</span><span class="sec-title">学习打卡统计</span></div>
      <div class="stats" style="margin-top:10px">
        <div class="stat-box"><div class="stat-num">${calcStreak()}</div><div class="stat-label">连续打卡天数</div></div>
        <div class="stat-box"><div class="stat-num">${ck.add}</div><div class="stat-label">今日新增单词</div></div>
        <div class="stat-box"><div class="stat-num">${ck.rev}</div><div class="stat-label">今日复习单词</div></div>
        <div class="stat-box"><div class="stat-num">${store.eng.words.length}</div><div class="stat-label">累计总词汇量</div></div>
      </div>
    </div>
  </div>`;
}
function renderEngHist(){
  const y=state.calY, m=state.calM;
  const first = new Date(y,m,1), startDow = first.getDay(), days = new Date(y,m+1,0).getDate();
  let cells = WEEK.map(w=>`<div class="cal-week">${w}</div>`).join('');
  for(let i=0;i<startDow;i++) cells += '<div class="cal-day empty"></div>';
  for(let d=1;d<=days;d++){
    const ds = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const has = !!store.eng.checkins[ds];
    const sel = state.calSel===ds;
    cells += `<div class="cal-day ${has?'has':''} ${sel?'sel':''}" ${has?`onclick="state.calSel='${ds}';renderContent()"`:''}>
      <span>${d}</span>${has?'<span class="cd"></span>':''}
    </div>`;
  }
  let detail='';
  if(state.calSel){
    const ws = store.eng.words.filter(w=>w.date===state.calSel);
    const ck = store.eng.checkins[state.calSel]||{add:0,rev:0};
    detail = `<div class="card">
      <div class="sec-head"><span class="sec-ico">📅</span><span class="sec-title">${fmtCN(state.calSel)} 学习记录</span>
      <span class="sec-count">新学 ${ck.add} · 复习 ${ck.rev}</span></div>
      ${ws.length?ws.map(w=>`<div class="item"><div class="item-main"><span class="item-ico">📖</span>
        <span class="item-name">${esc(w.word)}<span class="item-note">（${esc(w.mean)}）</span></span>
        <span class="tag tag-pos">${w.pos}</span></div></div>`).join('')
        :emptyHtml('💭','当日打卡了复习，没有录入新单词')}
    </div>`;
  }
  return `
  <div class="card">
    <div class="cal-head">
      <button class="cal-nav" onclick="calMove(-1)">‹</button>
      <b>${y}年${m+1}月</b>
      <button class="cal-nav" onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="save-hint" style="text-align:center;margin-top:10px">带圆点的日期为打卡日，点击可查看当日单词</div>

function copyText(txt, btn){
  const done = ()=>{ toast('已复制：'+txt); if(btn){btn.textContent='已复制✔'; setTimeout(()=>btn.textContent='复制',1200);} };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

/* ---- 文本解析引擎 ---- */
function parseTalentText(text){
  let blocks = text.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
  if(blocks.length<=1){
    const lines = text.split(/\r?\n/).map(b=>b.trim()).filter(Boolean);
    const platLines = lines.filter(l=>/抖音|快手|视频号/.test(l));
    const fullRows = lines.filter(l=>/抖音|快手|视频号/.test(l)&&/1[3-9]\d{9}|wx[:：]?|微信|粉丝|报价|坑位/i.test(l));
    if(fullRows.length>=2 || (platLines.length>=2 && platLines.length===lines.length)){
      blocks = lines;
    }
  }
  const results = [];
  for(const b of blocks){
    const t = {name:'',platform:'',platformId:'',type:'',contact:'',fans:'',price:'',org:'',note:'',status:'未合作'};
    if(/抖音/.test(b)) t.platform='抖音'; else if(/快手/.test(b)) t.platform='快手'; else if(/视频号/.test(b)) t.platform='视频号';
    if(/达播|直播/.test(b)) t.type='达播'; else if(/短视频|视频/.test(b)) t.type='短视频';
    const wx = b.match(/(?:微信|vx|wx|V信|weixin)[号:：\s]*([a-zA-Z][\w-]{4,19})/i);
    const tel = b.match(/1[3-9]\d{9}/);
    t.contact = [wx?('wx: '+wx[1]):'', tel?tel[0]:''].filter(Boolean).join(' / ');
    const fans = b.match(/(?:粉丝|粉)[量级:：\s]*([\d.]+)\s*([万wW千kK]?)/) || b.match(/([\d.]+)\s*([万wW])\s*粉/);
    if(fans){ const u = /千|k/i.test(fans[2]) ? (parseFloat(fans[1])/10)+'万' : fans[1]+'万'; t.fans = u; t.fansTime = today(); }
    const platformId = b.match(/(?:抖音号|快手号|视频号|账号号|账号|ID|id)[号:：\s]*([a-zA-Z0-9_\-]{2,30})/);
    if(platformId) t.platformId = platformId[1];
    const price = b.match(/(?:报价|坑位费|单条|一条|费用)[^\d]{0,6}([\d.]+\s*[万元kw]*)/i);
    if(price) t.price = price[0].replace(/\s+/g,'');
    const org = b.match(/(?:机构|公会|MCN|传媒|对接人?)[:：\s]*([^\s,，。;；]{2,15})/);
    if(org) t.org = org[0].replace(/\s+/g,'');
    /* 昵称：取首行去掉已识别的关键词部分 */
    const firstLine = b.split('\n')[0];
    let name = firstLine.replace(/(?:抖音号|快手号|视频号|账号号|账号|ID|id)[号:：\s]*[a-zA-Z0-9_\-]{2,30}/ig,'')
      .replace(/(?:微信|vx|wx|weixin)[号:：\s]*[a-zA-Z][\w-]{4,19}/ig,'')
      .replace(/1[3-9]\d{9}/g,'').replace(/(?:粉丝|粉)[量级:：\s]*[\d.]+\s*[万wW千kK]?/g,'')
      .replace(/[\d.]+\s*[万wW]\s*粉/g,'').replace(/(?:报价|坑位费|单条|一条|费用)[^\d]{0,6}[\d.]+\s*[万元kw]*/ig,'')
      .replace(/抖音|快手|视频号|达播|短视频|直播/g,'').replace(/[,，。;；:：|/\\-]+/g,' ').trim().split(/\s+/)[0]||'';
    t.name = name || '未命名达人';
    t.note = b.length>firstLine.length ? b.slice(firstLine.length).trim().replace(/\n+/g,' ').slice(0,120) : '';
    results.push(t);
  }
  return results;
}

function smartParse(){

/* ---- 文件解析 ---- */
function handleFiles(files){
  if(!files || !files.length) return;
  const f = files[0];
  const ext = f.name.split('.').pop().toLowerCase();
  if(ext==='csv' || ext==='txt'){
    const r = new FileReader();
    r.onload = e => parseTable(e.target.result);
    r.readAsText(f, 'utf-8');
  } else if(ext==='xlsx' || ext==='xls'){
    loadSheetJS(()=> {
      const r = new FileReader();
      r.onload = e => {
        try{
          const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          const csv = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
          parseTable(csv);
        }catch(err){ toast('Excel 解析失败，请转存为 CSV 后重试'); }
      };
      r.readAsArrayBuffer(f);
    });
  } else {
    toast('该格式暂需转存：请将 '+ext.toUpperCase()+' 内容复制到「粘贴识别」或转为 CSV/Excel');
  }
}
function loadSheetJS(cb){
  if(window.XLSX) return cb();
  /* 优先加载同域名(托管在 github.io 的)本地副本，国内必通；失败再回退境外 CDN */
  const sources = [
    './xlsx.full.min.js',
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
  ];
  let i = 0;
  function tryLoad(){
    if(i >= sources.length){ toast('Excel 解析组件加载失败（需联网），请改用 CSV 或粘贴文本'); return; }
    const src = sources[i++];
    const s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = tryLoad;
    document.head.appendChild(s);
  }
  toast('正在加载 Excel 解析组件…');
  tryLoad();
}
function parseTable(text){
  const rows = text.split(/\r?\n/).map(r=>r.split(/[,\t]/).map(c=>c.replace(/^"|"$/g,'').trim())).filter(r=>r.some(c=>c));
  if(rows.length<2){ /* 无表头结构，按纯文本解析 */ const list=parseTalentText(text); if(list.length){showParsePreview(list,'文档解析结果');}else toast('未识别到有效数据'); return; }
  const head = rows[0].map(h=>String(h||'').toLowerCase());
  const idx = key => head.findIndex(h=>key.some(k=>h.includes(String(k).toLowerCase())));
  const iName=idx(['昵称','姓名','名称','名字','达人']), iPlat=idx(['平台']), iType=idx(['类型','形式']),
        iPid=idx(['平台号','账号号','抖音号','快手号','视频号','id','账号']),
        iContact=idx(['联系','微信','电话','手机']), iFans=idx(['粉丝']), iPrice=idx(['报价','价格','费用','坑位']),
        iOrg=idx(['机构','对接','mcn']), iNote=idx(['备注','说明','风格']), iStatus=idx(['状态','合作']);
  if(iName<0){ const list=parseTalentText(text); if(list.length){showParsePreview(list,'文档解析结果');}else toast('未找到「昵称」列，请检查表头'); return; }
  const list = rows.slice(1).filter(r=>r[iName]).map(r=>({
    name:r[iName]||'未命名达人',
    platform:/抖音/.test(r[iPlat]||'')?'抖音':/快手/.test(r[iPlat]||'')?'快手':/视频号/.test(r[iPlat]||'')?'视频号':(r[iPlat]||''),
    type:/达播|直播/.test(r[iType]||'')?'达播':/短|视频/.test(r[iType]||'')?'短视频':(r[iType]||''),
    platformId:iPid>=0?(r[iPid]||''):'',
    contact:iContact>=0?(r[iContact]||''):'',
    fans:iFans>=0?(r[iFans]||''):'', fansTime:today(),
    price:iPrice>=0?(r[iPrice]||''):'',
    org:iOrg>=0?(r[iOrg]||''):'',
    note:iNote>=0?(r[iNote]||''):'',
    status:/合作中/.test(r[iStatus]||'')?'合作中':/已合作/.test(r[iStatus]||'')?'已合作':'未合作'
  }));
  if(!list.length){ toast('文档中没有有效数据行'); return; }
  showParsePreview(list, '文档解析结果');
}

/* ================= 通用弹窗 ================= */
function openForm(title, fields, init, onOk){
  const box = $('#modalBox');
  box.innerHTML = `<h3>${title}</h3>` + fields.map(f=>{
    const v = esc(init[f.k]||'');
    if(f.t==='textarea') return `<div class="field"><label>${f.l}${f.req?' *':''}</label><textarea id="f_${f.k}">${v}</textarea></div>`;
    if(f.t==='select') return `<div class="field"><label>${f.l}</label><select id="f_${f.k}">${f.opts.map(o=>`<option ${init[f.k]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
    return `<div class="field"><label>${f.l}${f.req?' *':''}</label><input id="f_${f.k}" value="${v}"></div>`;
  }).join('') + `
  <div class="modal-btns">
    <button class="pill-btn ghost" onclick="closeModal()">取消</button>
    <button class="pill-btn" id="mOk">保存</button>
  </div>`;
  $('#mOk').onclick = ()=>{
    const v={};
    for(const f of fields){
      v[f.k] = $('#f_'+f.k).value.trim();
      if(f.req && !v[f.k]){ toast('请填写「'+f.l+'」'); return; }
    }
    closeModal(); onOk(v);
  };
  $('#modalMask').classList.add('show');
  const fi = box.querySelector('input,textarea'); if(fi) setTimeout(()=>fi.focus(),100);
}
function openView(title, text){
  $('#modalBox').innerHTML = `<h3>${esc(title)}</h3><div class="full-text">${esc(text)}</div>
  <div class="modal-btns"><button class="pill-btn" onclick="closeModal()">关闭</button></div>`;
  $('#modalMask').classList.add('show');
}
function closeModal(){ $('#modalMask').classList.remove('show'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function changeAvatar(input){
  const file = input.files && input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = e => { store.avatar = e.target.result; save(); renderMenu(); toast('头像已更新 🌸'); };
  r.readAsDataURL(file);
}

initSync();
